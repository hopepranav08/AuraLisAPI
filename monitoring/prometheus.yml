global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: remediation-brain
    static_configs:
      - targets: ["remediation-brain:8000"]
    metrics_path: /metrics

  - job_name: ebpf-sensor
    static_configs:
      - targets: ["host.docker.internal:9090"]
    metrics_path: /metrics
